[[struct]]
name = "GameWorld"
size = 0x98D8
plate_comment = "Partial. weapon_table confirmed: InitWeaponTable memset *(world+0x510) for 0x80b0 bytes."

  [[struct.field]]
  offset = 0x1C
  name = "net_session"
  type = "void *"
  comment = "Per-game network session. Non-null is WA's online/offline discriminator; confirmed by OpenWA's constructor and main-loop branches."

  [[struct.field]]
  offset = 0x20
  name = "landscape"
  type = "Landscape *"
  comment = "Walk mask at Landscape+0x914. +0x910/+0x91C are paint. Map size at +0x77C0/+0x77C4."

  [[struct.field]]
  offset = 0x5CC
  name = "frame_counter"
  type = "int"
  comment = "Sim frame counter, incremented at the end of each frame in GameFrameDispatcher. WA keeps its own clock, so the determinism probe and any replay stream key off this rather than counting hook calls."

  [[struct.field]]
  offset = 0x45EC
  name = "game_rng"
  type = "uint"
  comment = "Game RNG state: rng = (frame_counter + rng) * 0x19660D + 0x3C6EF35F. ONE shared RNG for gameplay and visual effects alike -- there is no visual-only code in a lockstep engine. Divergence here means something perturbed WA itself."

  [[struct.field]]
  offset = 0x72EC
  name = "fx_rng"
  type = "uint"
  comment = "Client presentation RNG, advanced by GameTask__fxrandom (0x53F2E0) and inlined users including score bubbles, smoke, and sea bubbles. It may differ across peers."

  [[struct.field]]
  offset = 0x72F0
  name = "net_rng"
  type = "uint"
  comment = "Lockstep network RNG, advanced by GameTask__netrandom (0x53F300) and inlined users."

  [[struct.field]]
  offset = 0x7EF0
  name = "recorded_frame_counter"
  type = "int"
  comment = "Recording-side frame counter, -1 while a replay is playing back. WA's own equivalent of Project X's IsReplay()."

  [[struct.field]]
  offset = 0x777C
  name = "is_cavern"
  type = "uint"
  comment = "Nonzero on a cavern level. Set by GameRuntime__InitLandscapeBorders (0x528480) with the indestructible borders. From OpenWA's catalog; exposed as wa.world.cavern()."

  [[struct.field]]
  offset = 0x510
  name = "weapon_table"
  type = "WeaponTable *"
  comment = "Pointer to 71 WeaponEntry (no header). 71 * 0x1D0 = 0x80B0."

  [[struct.field]]
  offset = 0x528
  name = "collision_manager"
  type = "CollisionManager *"
  comment = "Entity registry + collision layers. Size 0x264, vtable 0x664194."

[[function]]
name = "WorldEntity__CollectCrate"
va = 0x00501340
calling_convention = "__stdcall"
plate_comment = "WA 3.8.1: (collector, team, worm_index, utility_flag). Searches nearby crates, asks vmethod 19 to resolve random contents, then vmethod 3 for message 0x7D8's 0x394-byte description. Single weapon branch calls TeamArena__AddAmmo at 0x5014B8; bundle branch at 0x501576. Collection notification snapshots crate position from the description call and the actual positive AddAmmo requests within this operation. It does not infer awards from net ammo differences. Health-only and destroyed crates have no awards."

[[function]]
name = "CrateEntity__GetDescription"
va = 0x00503F70
calling_convention = "__thiscall"
plate_comment = "WA 3.8.1 vmethod 3, (message, size, output), RET 0xC. Accepts 0x7D8 and copies 0x394 bytes from crate+0x110. The caller already ran vmethod 19, which selects random contents. Description does not own the pickup; notification dispatch waits until the enclosing collection routine returns and the root simulation frame finishes."


[[struct]]
name = "GameInfoTeamRecord"
size = 0xBB8
plate_comment = "WA 3.8.1: six setup records at GameInfo+0x450. Kept after deaths, so coalition membership is independent of surviving worms and physical ammo rows."

  [[struct.field]]
  offset = 0
  name = "owner_machine"
  type = "sbyte"
  comment = "Controller machine; negative for AI. InitTeamsFromLobby copies this to TeamEntity+0x40."

  [[struct.field]]
  offset = 1
  name = "coalition_colour"
  type = "byte"
  comment = "Visible coalition 0..5, read by game::team::worm_team_colour."

  [[struct.field]]
  offset = 0xBB4
  name = "worm_count"
  type = "byte"
  comment = "Number of setup worms. Zero for an unused team; persists after death. WA reads it at 0x55C06F, and the existing spawn/revive paths use it."
