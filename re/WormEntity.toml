[[function]]
va = 0x00510B40
name = "WormEntity__HandleMessage"
calling_convention = "__thiscall"
plate_comment = "Ghidra FUN_00510b40. Jump=0x24, JumpUp=0x25, StartTurn=0x34. These msgs already ride the lockstep stream."

  [function.signature]
  returns = "void"

  [[function.param]]
  name = "this"
  type = "WormEntity *"

  [[function.param]]
  name = "sender"
  type = "BaseEntity *"

  [[function.param]]
  name = "msg_type"
  type = "uint"

  [[function.param]]
  name = "size"
  type = "uint"

  [[function.param]]
  name = "data"
  type = "void *"

[[struct]]
name = "WormEntity"
plate_comment = "Partial. HandleMessage Jump/JumpUp already replicate. SetState case 0x6E at 0x50F2D5 enters stock drilling."

  [[struct.field]]
  offset = 0xFC
  name = "team"
  type = "uint"

  [[struct.field]]
  offset = 0x1AC
  name = "slope_direction"
  type = "int"
  plate_comment = "WormEntity__calc_sprite adds +1 to supported base sprites when negative and +2 when positive; used to select uphill/downhill custom-weapon poses."

  [[struct.field]]
  offset = 0x27C
  name = "drill_timer"
  type = "int"
  plate_comment = "WA 3.8.1 setup_Drilling derives this from active weapon entry +0x44. handle_Drilling subtracts 20 per update and exits to state 0x65 when <= 0."

  [[struct.field]]
  offset = 0x36C
  name = "active_weapon_entry"
  type = "void *"
  plate_comment = "Read by setup_Drilling to initialize the timer from entry +0x44."

[[function]]
va = 0x005186A0
name = "WormEntity__setup_Drilling"
calling_convention = "__thiscall"
plate_comment = "WA 3.8.1; initializes drill_timer (+0x27C) from active weapon entry (+0x36C), field +0x44."

[[function]]
va = 0x00518770
name = "WormEntity__handle_Drilling"
calling_convention = "__thiscall"
plate_comment = "WA 3.8.1; decrements drill_timer by 20 at 0x518795, calls stock landscape mask(2) with random jitter at 0x518770..0x518882, and transitions to state 0x65 when timer <= 0 at 0x518A26..0x518A38."

[[function]]
va = 0x00512E80
name = "WormEntity__calc_sprite"
calling_convention = "__usercall"
plate_comment = "WA 3.8.1 byte-verified: ESI=worm, EAX=sprite_out, stack x_out/y_out/phase_out, RET 12. DrawSprite at 0x50FCD0 calls this before stock blit. Wrap calls original, then remaps only sprite_out for the selected slot; retains stock animation, slope and flip."

[[function]]
va = 0x0051C060
name = "Weapon__hold_sheet"
calling_convention = "__usercall"
plate_comment = "WA 3.8.1: EAX = weapon entry, stack = worm, RET 4. Returns the sheet the worm aims or holds the weapon with, or 0 for none WA knows. Projectiles switch on +0x34 (1-12); placed weapons with fire method 2 map their flight sprite (+0x60): 74 vase, 78 dynamite, 153 sheep, 162/163 old woman, 164 cow, 166 mole, 173 skunk. Five callers in WormEntity."
