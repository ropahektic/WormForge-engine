# D3D9 shader renderer — lifecycle and optional RGBA composition.
#
# WA 3.8.1 ships two renderers. The shader one uploads the frame as palette
# INDICES plus a palette texture and resolves colour on the GPU; its software
# sibling dispatches to 0x59CB30 instead and has none of this. That index +
# palette split accepts an RGBA companion without changing the map palette.
#
# Addresses and layout confirmed against wkFOW's ShaderRenderer, which hooks the
# same three sites for its fog composite.

[[function]]
va = 0x0059CDE0
name = "Display__D3D9ShaderPresent"
calling_convention = "__fastcall"
plate_comment = "Shader renderer present. ECX=renderer, EDX=result buffer, [ESP+4]=framebuffer. Wrap before the original; a third argument rides EAX so the thunk must preserve everything."

[[function]]
va = 0x0059CD70
name = "Display__D3D9ShaderResourcesCleanup"
calling_convention = "__thiscall"
plate_comment = "Releases the renderer's D3DPOOL_DEFAULT textures. ECX=renderer, no stack args. Anything we own on that device must be released here too, before WA resets."

[[function]]
va = 0x0059CF9D
name = "Display__D3D9ShaderFogDraw"
calling_convention = "__usercall"
plate_comment = "Inside D3D9ShaderPresent, after WA binds its palette texture and built-in shader and immediately before the fullscreen draw. EDI=renderer. Optional RGBA/underlay textures on stages 2/3; restore stock device state after present."

[[global]]
va = 0x0000001C
name = "D3D9Renderer_width"
plate_comment = "Offsets from the shader renderer object, not absolute VAs: width 0x1C, height 0x20, device 0x40, frame texture 0x7C, pixel shader 0x84, palette texture 0x88."

[[function]]
va = 0x00523500
name = "DisplayGfx__GetSpriteInfo"
calling_convention = "__thiscall"
plate_comment = "WA 3.8.1: ECX=display; stack=(sprite_id, rate_out, flags_out, frames_out), RET 16. IDs outside 1..1023 return 0 without initializing any outputs. SpriteAnimation__play_1 at 0x4F5BD0 ignores failure: it copies the two untouched stack locals into animator+0x14/+0x18 and queue+0x30/+0x34. An empty equip pose (ID 0) can therefore leak process addresses into the stock checksum. WormForge supplies rate=0, flags=0, frames=1 for ID 0 before delegating, retaining failure. The one-frame fallback also prevents division by zero when the animator sprite word has only high flag bits."
