[[function]]
va = 0x00508330
name = "MissileEntity__Free"
calling_convention = "__thiscall"
plate_comment = "Vtable slot 1 (0x664438+4). (this, flags) RET 4, returns this. Calls the destructor 0x5086F0 -- its only caller -- then frees the allocation if flags bit 0 is set. So every missile's end passes through here."

[[function]]
va = 0x0050B400
name = "MissileEntity__HandleMessage"
calling_convention = "__thiscall"
plate_comment = "Ghidra FUN_0050b400. FrameFinish = msg 2. Fuse ticks here; golf freeze/arm runs on this tick for both peers."

  [function.signature]
  returns = "void"

  [[function.param]]
  name = "this"
  type = "MissileEntity *"

  [[function.param]]
  name = "sender"
  type = "BaseEntity *"

  [[function.param]]
  name = "msg_type"
  type = "uint"

  [[function.param]]
  name = "size"
  type = "uint"

  [[function.param]]
  name = "data"
  type = "void *"

[[vtable]]
va = 0x00664438
name = "MissileEntityVtable"
comment = "Identity check: entity[0] == rebase(this)."

