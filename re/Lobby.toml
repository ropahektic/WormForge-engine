# The network lobby's ready bulbs. Addresses match wkFOW's byte signatures
# (src/Signatures.h) on stock WA 3.8.1; the CPlayers layout is OpenWA's
# (engine/mp/registration.rs, common.rs) and wkFOW's ShowLobbyMachines check.

[[function]]
va = 0x00482700
name = "LobbyList__UpdateReady"
calling_convention = "__thiscall"
signature = "void LobbyList::UpdateReady(LobbyList *this)"
plate_comment = "Player list redraws its ready bulbs from CPlayers. Runs on host and client whenever a bulb changes."

[[function]]
va = 0x004C1E90
name = "LobbyNetList__UpdateReady"
calling_convention = "__thiscall"
signature = "void LobbyNetList::UpdateReady(LobbyNetList *this)"
plate_comment = "Network list's copy of the same refresh."

[[function]]
va = 0x0046AD10
name = "CPlayers__IsOkToStartNetGame"
calling_convention = "__usercall"
signature = "bool __usercall CPlayers::IsOkToStartNetGame(CPlayers *this@<edi>)"
plate_comment = "Host's Start gate: every active machine ready. No stack arguments; result in EAX. Transiently true with one machine."

[[global]]
va = 0x008779D8
name = "G_CPLAYERS"
type = "CPlayers"
comment = "Lobby machine table singleton. The ready flag of machine n is at +n*0x78+0x82."

[[struct]]
name = "CPlayers"

  [[struct.field]]
  offset = 0x8
  name = "local_slot"
  type = "int"
  comment = "This machine's record. 0 is the host: WA's BuildPeerConnectionsArray reads == 0 as 'I am the host'."

  [[struct.field]]
  offset = 0x80
  name = "machine0_active"
  type = "byte"
  comment = "First record's active flag; records repeat every 0x78 bytes, 13 of them."

  [[struct.field]]
  offset = 0x82
  name = "machine0_ready"
  type = "byte"
  comment = "First record's ready bulb."

# Lobby packets. Addresses match wkTerrainSync's signatures (src/Packets.cpp);
# the default branches were read in WA.exe: a type neither side knows returns
# 0 without effect (host via 0x4AC0D0, client via 0x4BB1F0).

[[function]]
va = 0x004B6290
name = "HostLobby__HandlePacket"
calling_convention = "__thiscall"
signature = "int HostLobby::HandlePacket(HostLobby *this, int slot, uint8_t *packet, size_t size)"
plate_comment = "Host lobby: one packet from client `slot`. Types 0, 0x10, 0x1A here, the rest to 0x4AC0D0. RET 0xC."

[[function]]
va = 0x004C0790
name = "ClientLobby__HandlePacket"
calling_convention = "__thiscall"
signature = "int ClientLobby::HandlePacket(ClientLobby *this, uint8_t *packet, size_t size)"
plate_comment = "Client lobby: one packet from the host. Types up to 0x32 here, the rest to 0x4BB1F0. RET 8."

[[global]]
va = 0x007C0ED4
name = "G_HOST_SESSION"
type = "GameSyncHost"
comment = "Host's connections (OpenWA GAMESYNC_HOST_SINGLETON). +0xC nonzero while hosting; per-slot records 0x19118 apart: +0x25C state (3 = connected), +0x1A4 the connection object. HostUnicast (0x58F9F0) sends through connection vtable+0x34."

[[global]]
va = 0x00857A3C
name = "G_CLIENT_LINK"
type = "Connection"
comment = "Client's connection to the host, from ClientEndscreenPacketHandler (0x4BD400) + 0x103. +0xB8 state (3 = connected); send is vtable+0x34 (this, data, size)."

[[function]]
va = 0x00493CB0
name = "Lobby__DisplayMessage"
calling_convention = "__stdcall"
signature = "int Lobby::DisplayMessage(void *log, const char *text)"
plate_comment = "Shows a line in a lobby screen's message log (screen + 0x10318); a SYS::ALL: prefix marks a system line. wkFOW's LobbyDisplayMessage signature."

[[function]]
va = 0x004AC0D0
name = "HostEndscreen__HandlePacket"
calling_convention = "__thiscall"
signature = "void HostEndscreen::HandlePacket(HostEndscreen *this, int slot, uint8_t *packet, size_t size)"
plate_comment = "Host's end screen between rounds: one packet from client `slot`; also gets the host lobby handler's unhandled types. After a bulb packet it refreshes through this->vtable+0x170. RET 0xC."

[[function]]
va = 0x004BD400
name = "ClientEndscreen__HandlePacket"
calling_convention = "__thiscall"
signature = "int ClientEndscreen::HandlePacket(ClientEndscreen *this, uint8_t *packet, size_t size)"
plate_comment = "Client's end screen between rounds: one packet from the host; types it does not know go to 0x4BB1F0. RET 8."
