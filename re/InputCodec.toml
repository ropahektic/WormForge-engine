# WA 3.8.1's compact input-message codec. Project X hooks the corresponding
# 3.6.31 pair (0x531560 / 0x531B50) to add fixed 12-byte message payloads.

[[function]]
va = 0x005648B0
name = "EncodeInputMessage"
calling_convention = "__stdcall"
plate_comment = "Compact one queued input message into the network/replay byte stream. Custom ABI: ECX=destination, EDX=payload; stack=(capacity, kind, protocol fields), RET 0x10. Stock kinds end at 0x74."

[[function]]
va = 0x00564EA0
name = "DecodeInputMessage"
calling_convention = "__stdcall"
plate_comment = "Decode one compact network/replay input message. Custom ABI: EAX=kind out, ECX=source, ESI=payload out; stack=(available bytes, payload-size out, protocol fields), RET 0x14. Stock kinds end at 0x74."

[[function]]
va = 0x0053E7D0
name = "GameNet__IsBroadcastTag"
plate_comment = "Returns AL=1 for selected stock kinds admitted even when the source predicate at GameNet+vtable[0x1C] is false. At 0x53E22C the true-source path queues all decoded kinds without consulting this classifier. Leave stock behavior unchanged; this is not a checksum over input bytes."

[[function]]
va = 0x00532330
name = "GameRuntime__SerializeChecksumState"
calling_convention = "__stdcall"
plate_comment = "Stack=(runtime, buffer), RET 8. Serializes simulation state before kind-8 checksum calculation at 0x532B89. Main stream pointer at buffer+0, byte count at buffer+0x0C. 0x546140 rotates accumulator left 3 and adds each byte; 0x532C06 adds the world+0x20 object's virtual +0x48 result. Alternate checksum path calls 0x546170."
