# Landscape + PlaySoundLocal (3.8.1)

# Wraps, not traps. Lua sees `wa.land` / `wa.sound`, not CTask offsets.

[[function]]
va = 0x004FDFE0
name = "PlaySoundLocal"
calling_convention = "__stdcall"
plate_comment = "Usercall EAX=pitch ECX=volume EDI=entity; stack sound_id + flags; RET 8. Jelly playSoundLocal. openWA re/_bootstrap_004f0000.toml."

[[struct]]
name = "Landscape"
size = 0xB40
plate_comment = "GameWorld+0x20. Vtable 0x66B208: slot 2 ApplyExplosion (0x57C820), slot 3 mask cut (0x57CCF0); both take (size/shape, x_px, y_px). Walk mask +0x914, picture +0x910, soil +0x91C."

  [[struct.field]]
  offset = 0x088
  name = "cut_shapes"
  type = "void *[12]"
  comment = "Preloaded WA mask pointers. Pneumatic Drill uses 2; Blow Torch uses 6..11."

  [[struct.field]]
  offset = 0x0D0
  name = "plot_scratch"
  type = "BitGrid *"
  comment = "WriteLandRaw row scratch. FUN_0057d040 allocates this. Not locomotion."

  [[struct.field]]
  offset = 0x910
  name = "terrain_image"
  type = "BitGrid *"
  comment = "8bpp fill. Soil colour can remain after a blast."

  [[struct.field]]
  offset = 0x914
  name = "collision"
  type = "BitGrid *"
  comment = "Walk/jump mask. FUN_0057cc90 tests this first."

  [[struct.field]]
  offset = 0x91C
  name = "soil"
  type = "BitGrid *"
  comment = "Cave-in / soil paint. Walk in front of it."

  [[struct.field]]
  offset = 0xB3C
  name = "indestructible_control"
  type = "uint32_t"
  comment = "SetControlFlag control; nonzero makes ApplyExplosion and mask cut return early."

