[workspace]
members = ["crates/*"]
resolver = "2"
default-members = ["crates/wk-lua"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ropahektic/WormForge"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
png = "0.17"
gif = "0.13"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_Networking_WinHttp",
] }
minhook = "0.8"

[profile.release]
lto = false
# Public wkLua.dll: no PDB / CV symbols in the shipped binary.
strip = "symbols"
