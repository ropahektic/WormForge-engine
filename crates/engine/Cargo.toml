[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
sync-diagnostics = []

[dependencies]
game = { path = "../game" }
gfx = { path = "../gfx" }
render = { path = "../render" }
replay = { path = "../replay" }
assets = { path = "../assets" }
lua-host = { path = "../lua-host" }
re-catalog = { path = "../re-catalog" }
minhook = { workspace = true }
weapons = { path = "../weapons" }
actors = { path = "../actors" }
windows-sys = { workspace = true }
# Both already in the tree (gfx → png, replay → flate2): the mod loader's
# banner decode and pack-zip inflate add no new dependency weight.
png = { workspace = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[build-dependencies]
cc = "1"
