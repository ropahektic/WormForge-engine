[package]
name = "replay"
version.workspace = true
edition.workspace = true
license.workspace = true

# Deliberately no dependency on `engine`: engine cannot be compiled on darwin
# (minhook's build script rejects it), so a format crate living there would be
# untestable on a developer's Mac. Everything here is pure bytes, so the whole
# container -- round-trip, refusals, truncation -- is testable on the host,
# exactly as `crates/render` is.
#
# `flate2` is already in the lock (png pulls it), so this adds no new download.
# `rust_backend` keeps the deflate implementation pure Rust, which matters for
# the i686 Windows target where a system zlib may not exist.
[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
